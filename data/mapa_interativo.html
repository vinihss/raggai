<!DOCTYPE html><html lang="pt"><head><meta charset="UTF-8"><title>Grafo Híbrido</title><script src="https://unpkg.com/vis-network/standalone/umd/vis-network.min.js"></script><style>body { margin:0; background:#1e1e2e; color:#cdd6f4; font-family:sans-serif; } #mynetwork { width:100vw; height:100vh; background:#181825; } #panel { position:absolute; top:15px; left:15px; z-index:10; background:rgba(30,30,46,0.95); padding:15px; border-radius:12px; border:1px solid #45475a; } .box { width:100%; padding:8px; background:#313244; border:1px solid #45475a; border-radius:6px; color:#cdd6f4; outline:none; }</style></head><body><div id="panel"><h1>Memória do Agente</h1><input type="text" id="sb" class="box" placeholder="Filtrar..." oninput="f()"/></div><div id="mynetwork"></div><script>const oNodes=${JSON.stringify(nodes)}, oEdges=${JSON.stringify(edges)}, nDS=new vis.DataSet(oNodes), eDS=new vis.DataSet(oEdges), net=new vis.Network(document.getElementById('mynetwork'), {nodes:nDS, edges:eDS}, {physics:{stabilization:{iterations:150}}}); function f(){ const s=document.getElementById('sb').value.toLowerCase().trim(); if(!s){ nDS.update(oNodes); eDS.clear(); eDS.add(oEdges); return; } const m=oNodes.filter(n=>n.id.toLowerCase().includes(s)).map(n=>n.id), v=new Set(m), e=[]; oEdges.forEach(eg=>{ if(v.has(eg.from)||v.has(eg.to)){ e.push(eg); v.add(eg.from); v.add(eg.to); } }); nDS.update(oNodes.map(n=>({...n, hidden: !v.has(n.id)}))); eDS.clear(); eDS.add(e); }</script></body></html>
